<svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconCoinGrad" x1="4" y1="4" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="iconInnerGlow" x1="22" y1="6" x2="22" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F1026" />
    </linearGradient>
    <linearGradient id="iconPlusGrad" x1="18" y1="12" x2="34" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Outer Glow ring -->
  <circle cx="22" cy="22" r="21" stroke="url(#iconCoinGrad)" stroke-width="1.5" opacity="0.35" />
  
  <!-- Base Coin Body -->
  <rect x="4" y="4" width="36" height="36" rx="11" fill="url(#iconInnerGlow)" stroke="url(#iconCoinGrad)" stroke-width="2" />
  
  <!-- Stylized "C" path -->
  <path d="M27 15C24.5 13 18 13.5 15 17.5C12 21.5 12.5 26 15 29.5C17.8 33 24 33.5 27 31" 
        stroke="url(#iconCoinGrad)" stroke-width="3.2" stroke-linecap="round" fill="none" />
        
  <!-- Glowing "+" (Plus) sign -->
  <g transform="translate(25, 19)">
    <path d="M-3 4H7" stroke="url(#iconPlusGrad)" stroke-width="3" stroke-linecap="round" />
    <path d="M2 -1V9" stroke="url(#iconPlusGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="2" cy="4" r="1.2" fill="#FFFFFF" />
  </g>
</svg>
