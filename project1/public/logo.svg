<svg width="180" height="44" viewBox="0 0 180 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background / Coin Gradients -->
    <linearGradient id="coinGrad" x1="4" y1="4" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="20" y1="6" x2="20" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F1026" />
    </linearGradient>
    <linearGradient id="plusGrad" x1="18" y1="12" x2="32" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="textGrad" x1="90" y1="14" x2="145" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="glow" x="1" y="1" width="40" height="40" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Coin Emblem Group -->
  <g transform="translate(1, 1)">
    <!-- Outer Glow ring -->
    <circle cx="21" cy="21" r="20" stroke="url(#coinGrad)" stroke-width="1.5" opacity="0.4" />
    
    <!-- Base Coin Body -->
    <rect x="3" y="3" width="36" height="36" rx="11" fill="url(#innerGlow)" stroke="url(#coinGrad)" stroke-width="2" />
    
    <!-- Stylized "C" path -->
    <path d="M26 14C23.5 12 17 12.5 14 16.5C11 20.5 11.5 25 14 28.5C16.8 32 23 32.5 26 30" 
          stroke="url(#coinGrad)" stroke-width="3.2" stroke-linecap="round" fill="none" />
          
    <!-- Glowing "+" (Plus) sign -->
    <g transform="translate(24, 18)">
      <!-- Horizontal bar -->
      <path d="M-3 4H7" stroke="url(#plusGrad)" stroke-width="3" stroke-linecap="round" />
      <!-- Vertical bar -->
      <path d="M2 -1V9" stroke="url(#plusGrad)" stroke-width="3" stroke-linecap="round" />
      <!-- Core spark dot -->
      <circle cx="2" cy="4" r="1.2" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Typography -->
  <!-- "Coin" in bold white -->
  <text x="52" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Coin</text>
  
  <!-- "Plus" in gradient cyan-purple -->
  <text x="104" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">Plus</text>
  
  <!-- Subtitle badge: "TRADING BOT" -->
  <text x="53" y="37" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#818CF8" letter-spacing="2.2" opacity="0.85">CRYPTO TRADING</text>
</svg>
